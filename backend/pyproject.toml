[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rae-smart-report-backend"
version = "0.1.0"
description = "Deterministic E-Commerce Sales Transformation & Reporting Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "SQLAlchemy>=2.0.28",
    "openpyxl>=3.1.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "app",
    "."
]

[tool.ruff]
line-length = 110
exclude = ["tests", ".venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF", "PIE"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ALL"]
